name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux application
        run: |
          FFMPEG="$(command -v ffmpeg)"
          FFPROBE="$(command -v ffprobe)"

          pyinstaller \
            --windowed \
            --name "Audio Extractor" \
            --add-binary "$FFMPEG:." \
            --add-binary "$FFPROBE:." \
            main.py

      - name: Create ZIP package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cd dist
          zip -r "../Audio-Extractor-${VERSION}-Linux.zip" "Audio Extractor"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: Audio-Extractor-${{ github.ref_name }}-Linux.zip

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install FFmpeg
        run: choco install ffmpeg -y

      - name: Build Windows executable
        shell: powershell
        run: |
          $ffmpeg = (Get-Command ffmpeg).Source
          $ffprobe = (Get-Command ffprobe).Source

          pyinstaller `
            --windowed `
            --name "Audio Extractor" `
            --add-binary "$ffmpeg;." `
            --add-binary "$ffprobe;." `
            main.py

      - name: Create ZIP package
        shell: powershell
        run: |
          Compress-Archive `
            -Path "dist\Audio Extractor\*" `
            -DestinationPath "Audio-Extractor-${{ github.ref_name }}-Windows.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: Audio-Extractor-${{ github.ref_name }}-Windows.zip

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS application
        run: |
          FFMPEG="$(command -v ffmpeg)"
          FFPROBE="$(command -v ffprobe)"

          pyinstaller \
            --windowed \
            --name "Audio Extractor" \
            --add-binary "$FFMPEG:." \
            --add-binary "$FFPROBE:." \
            main.py

      - name: Create ZIP package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          cd dist
          ditto -c -k --sequesterRsrc --keepParent \
            "Audio Extractor.app" \
            "../Audio-Extractor-${VERSION}-macOS.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: Audio-Extractor-${{ github.ref_name }}-macOS.zip

  release:
    needs:
      - build-linux
      - build-windows
      - build-macos

    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
